name: unit

on:
  push:
    branches: [main, develop, Develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fakeredis==2.37.1

      - name: Lint (ruff)
        run: ruff check gateway brain adapter ui schemas wizard scripts tests --select E9,F63,F7,F82 --exit-zero

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-0000-0000 || true

      - name: Unit tests with 70% coverage gate
        run: >
          python -m pytest tests/unit -q
          --cov=gateway --cov=brain --cov=adapter --cov=ui --cov=schemas
          --cov=wizard --cov=scripts --cov-report=term

      - name: Secret scan
        run: |
          pip install detect-secrets
          # detect-secrets 1.5.x has no stdout output in --baseline mode,
          # so scan plainly and diff against the committed baseline here.
          detect-secrets scan \
            --exclude-files '\.env\.example$' \
            --exclude-files 'node_modules' \
            --exclude-files '\.venv' \
            --exclude-files 'secrets\.baseline' > new_secrets.json || true
          python - <<'EOF'
          import json, sys
          new = json.load(open('new_secrets.json'))['results']
          base = json.load(open('secrets.baseline'))['results']
          # Normalize Windows/Linux path separators when comparing.
          def sig(f, s): return (f.replace('\\\\', '/'), s['type'])
          known = {sig(f, s) for f, items in base.items() for s in items}
          fresh = {f: [s for s in items if sig(f, s) not in known]
                   for f, items in new.items()}
          fresh = {f: v for f, v in fresh.items() if v}
          if fresh:
              print('NEW POTENTIAL SECRETS FOUND:')
              for f, items in fresh.items():
                  for s in items:
                      print(f"  {f}:{s['line_number']} {s['type']}")
              sys.exit(1)
          print('no new secrets detected')
          EOF
