name: unit

on:
  push:
    branches: [main, develop, Develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fakeredis==2.37.1

      - name: Lint (ruff)
        run: ruff check gateway brain adapter ui schemas wizard scripts tests --select E9,F63,F7,F82 --exit-zero

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-0000-0000 || true

      - name: Unit tests with 70% coverage gate
        run: >
          python -m pytest tests/unit -q
          --cov=gateway --cov=brain --cov=adapter --cov=ui --cov=schemas
          --cov=wizard --cov=scripts --cov-report=term

      - name: Secret scan
        run: |
          pip install detect-secrets
          # Fail only on findings NOT in the committed baseline.
          detect-secrets scan --baseline secrets.baseline \
            --exclude-files '\.env\.example$' \
            --exclude-files 'node_modules' \
            --exclude-files '\.venv' > new_secrets.json || true
          python - <<'EOF'
          import json, sys
          data = json.load(open('new_secrets.json'))
          results = data.get('results', {})
          if results:
              print('NEW POTENTIAL SECRETS FOUND:')
              for f, items in results.items():
                  for s in items:
                      print(f"  {f}:{s['line_number']} {s['type']}")
              sys.exit(1)
          print('no new secrets detected')
          EOF
