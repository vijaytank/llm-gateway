meta:
  schema_version: '1.0'
general_settings:
  master_key: "REPLACE_ME__set_LITELLM_MASTER_KEY_in_docker_dot_env"
  database_url: ${GATEWAY_DB_URL}
  redis_url: ${GATEWAY_REDIS_URL}
  background_health_checks: true
  use_shared_health_check: true
routing_defaults:
  latency_slow_threshold_ms: 8000
  latency_critical_threshold_ms: 20000
  circuit_breaker_failure_count: 3
  circuit_breaker_window_seconds: 300
  cooldown_429_seconds: 600
  cooldown_5xx_seconds: 1800
  cooldown_auth_seconds: 86400
  score_weight_success_rate: 0.4
  score_weight_latency: 0.35
  score_weight_quota_headroom: 0.25
  quota_deprioritize_threshold: 0.8
  health_check_base_interval_seconds: 7200
  health_check_error_backoff_multiplier: 2.0
  health_check_max_interval_seconds: 21600
  moving_avg_window: 50
connectivity:
  offline_probe_host: 1.1.1.1
  offline_probe_port: 53
  offline_probe_interval_seconds: 30
  min_provider_failures_for_offline: 2
providers:
  nvidia:
    enabled: true
    tier: free
    probe_timeout_seconds: 12
    extra_headers: {}
    warn_on_charge_risk: false
    effective_rpd: null
  openrouter:
    enabled: true
    tier: free
    probe_timeout_seconds: 12
    extra_headers:
      HTTP-Referer: http://localhost:4000
      X-Title: llm-gateway
    warn_on_charge_risk: true
    effective_rpd: 40
  groq:
    enabled: true
    tier: free
    probe_timeout_seconds: 12
    extra_headers: {}
    warn_on_charge_risk: false
    effective_rpd: null
  cerebras:
    enabled: true
    tier: free
    probe_timeout_seconds: 12
    extra_headers: {}
    warn_on_charge_risk: false
    effective_rpd: null
  local:
    enabled: false
    tier: free
    probe_timeout_seconds: 12
    extra_headers: {}
    warn_on_charge_risk: false
    effective_rpd: null
  ollama_base_url: http://localhost:11434
  vllm_base_url: ''
virtual_models:
- name: auto-free
  capabilities:
  - general
  tier: free
  fallback_chain:
  - nvidia-auto
  - groq-auto-free
  - cerebras-auto-free
  - openrouter-free
  - local-auto
  - premium-auto
- name: auto-code-free
  capabilities:
  - code
  tier: free
  fallback_chain:
  - nvidia-code-free
  - groq-code-free
  - cerebras-code-free
  - openrouter-code-free
  - local-code
  - premium-code
- name: auto-reasoning-free
  capabilities:
  - reasoning
  tier: free
  fallback_chain:
  - nvidia-reasoning-free
  - groq-reasoning-free
  - openrouter-reasoning-free
  - local-reasoning
  - premium-reasoning
litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: ${REDIS_HOST}
    port: 6379
custom_providers: []
